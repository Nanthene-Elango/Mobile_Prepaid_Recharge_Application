<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Support Section</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/1.7.1/css/buttons.dataTables.min.css">
    <link rel="stylesheet" href="../assets/js/Admin/util.js">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        h2 {
            margin-bottom: 30px;
            font-weight: bold;
            color: #343a40;
        }
        .table {
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .table thead th {
            background-color: #007bff;
            color: white;
            text-align: center;
        }
        .table tbody tr {
            transition: background-color 0.3s;
        }
        .table tbody tr:hover {
            background-color: #e9ecef;
        }
        .btn-success {
            margin-bottom: 20px;
        }
        .dataTables_wrapper {
            margin: 20px;
        }
        /* Custom styles for DataTables elements */
        .dataTables_paginate .paginate_button {
            padding: 0.5rem 1rem;
            margin: 0 0.1rem;
            border-radius: 0.25rem;
            border: 1px solid #007bff;
            background: white;
            color: #007bff;
            transition: background-color 0.3s, color 0.3s;
        }
        .dataTables_paginate .paginate_button:hover {
            background: #007bff;
            color: white;
        }
        .dataTables_paginate .paginate_button.current {
            background: #007bff;
            color: white;
        }
        .dataTables_filter input {
            border: 1px solid #007bff;
            border-radius: 0.25rem;
            padding: 0.5rem;
            margin-left: 0.5rem;
        }
        .dt-button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 0.25rem;
            padding: 0.5rem 1rem;
            transition: background-color 0.3s;
        }
        .dt-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center">Subscriber Feedback & Issues</h2>
    <div class="mb-3 text-right">
        <button id="exportCSV" class="btn btn-success">Export to CSV</button>
    </div>
    <table id="feedbackTable" class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Subscriber Name</th>
                <th>Email</th>
                <th>Category</th>
                <th>Feedback/Issue</th>
                <th>Status</th>
                <th>Date Submitted</th>
            </tr>
        </thead>
        <tbody>
            <!-- Sample Data -->
            <tr>
                <td>1</td>
                <td>John Doe</td>
                <td>john@example.com</td>
                <td>Payment Issue</td>
                <td>Unable to recharge my account.</td>
                <td>Pending</td>
                <td>2023-10-01</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Jane Smith</td>
                <td>jane@example.com</td>
                <td>Technical Support</td>
                <td>App crashes on startup.</td>
                <td>Resolved</td>
                <td>2023-10-02</td>
            </tr>
            <!-- Add more rows as needed -->
        </tbody>
    </table>
</div>

<!-- jQuery and Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
<!-- DataTables JS -->
<script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/1.7.1/js/dataTables.buttons.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/1.7.1/js/buttons.html5.min.js"></script>

<script>
    $(document).ready(function() {
        var table = $('#feedbackTable').DataTable({
            "paging": true,
            "searching": true,
            "ordering": true,
            "info": true,
            "lengthChange": true,
            "pageLength": 10,
            "dom": 'Bfrtip',
            "buttons": [
                {
                    extend: 'csvHtml5',
                    text: 'Export to CSV',
                    title: 'Subscriber Feedback & Issues'
                }
            ]
        });

        // Export to CSV button functionality
        $('#exportCSV').on('click', function() {
            table.button('.buttons-csv').trigger();
        });
    });
</script>
