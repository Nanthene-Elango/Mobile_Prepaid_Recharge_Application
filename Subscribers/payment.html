<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepaidGo | Payment</title>
    <link rel="icon" type="image/x-icon" href="./assets/img/favicon.ico">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/invoice.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>


</head>

<body style="background-color: aliceblue;">
    <nav class="navbar navbar-expand-md navbar-light bg-white sticky-top"
        style="box-shadow: 1px 2px 10px rgb(198, 198, 198);">
        <div class="container-fluid">
            <a class="navbar-brand mx-4" href="./index.html">
                <img src="./assets/img/Logo.png" alt="Logo" style="height: 60px;">
            </a>
        </div>
    </nav>
    
    <div class="m-4">
        <button class="btn" style="background-color: rgb(0,32,96);" id="backBtn">
            <a href="./recharge.html" class="text-decoration-none text-light"><i class="fas fa-arrow-left pe-1"></i>
                Back</a>
        </button>
    </div>

    <div class="container-fluid col-11 d-flex flex-column-reverse flex-lg-row justify-content-center">

        <div class="col-12 col-lg-6 col-xxl-5 mb-5 me-lg-2"
            style="box-shadow: 1px 2px 10px darkgray;border-radius: 5px; background-color: white;">

            <div class="p-4 pb-0 d-flex flex-column flex-sm-row justify-content-between position-sticky top-0"
                style="border-radius: 5px; background-color: white;">
                <h5 style="color: rgb(0,32,96);">Choose Payment Method</h5>
                <div><img src="./assets/img/safe.png" style="height: 15px;"><span style="font-size: x-small;"
                        class="text-muted">100% SAFE PAYMENTS</span></div>
            </div>
            <hr class="mx-4">

            <div class="accordion col-12 overflow-auto" id="payment-method" style="max-height: 450px;">

                <div class="accordion-item mt-2 px-3" style="border: none;">
                    <h2 class="accordion-header" id="method1">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                            data-bs-target="#answer1">
                            <div style="font-size: 1.07rem; font-weight: 500;"><img src="./assets/img/upi.jpeg" alt=""
                                    style="height: 8px;"> Pay by an UPI App</div>
                        </button>
                    </h2>
                    <div id="answer1" class="accordion-collapse collapse" data-bs-parent="#payment-method">
                        <div class="accordion-body">
                            <form action="" id="payment_form1">
                                Choose an UPI App:
                                <div class="d-flex align-items-center justify-content-center pb-3 upiapp">
                                    <a href="#upiId" id="phonePay"><img class="mx-1" src="./assets/img/phonePe.png"
                                            alt="" style="height: 40px;"></a>
                                    <a href="#upiId" id="googlePay"><img class="mx-1" src="./assets/img/google-pay.png"
                                            alt="" style="height: 40px;"></a>
                                    <a href="#upiId" id="paytm"><img class="mx-1" src="./assets/img/paytm.png" alt=""
                                            style="height: 40px;"></a>
                                    <a href="#upiId" id="amazonPay"><img class="mx-1" src="./assets/img/amazonPay.png"
                                            alt="" style="height: 40px;"></a>
                                </div>
                                <div class="d-none" id="upiId">
                                    <label for="" class="pb-3" style="font-size: 1.05rem; font-weight: 500;">Enter your
                                        UPI ID: </label>
                                    <input type="text" name="upi" class="form-control" placeholder="UPI ID"
                                        id="upiInput" value="">
                                    <div id="error-upi" class="text-danger pt-1" style="min-height: 3vh;font-size: small;">
                                    </div>
                                    <div class="d-flex flex-row-reverse mt-3">
                                        <button id="upiVerify" class="btn btn-light" onclick="processPayment('UPI')"
                                            style="background-color: rgb(0,32,96); color: aliceblue;" disabled>
                                            Verify & Pay
                                        </button>
                                        <button class="btn btn-outline-light me-2"
                                            style="color: rgb(0,32,96); border: 1px solid rgb(0,32,96);">
                                            Cancel
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <hr>
                <div class="accordion-item px-3" style="border: none;">
                    <h2 class="accordion-header" id="method2">
                        <button class="accordion-button collapsed " type="button" data-bs-toggle="collapse"
                            data-bs-target="#answer2">
                            <div style="font-size: 1.07rem; font-weight: 500;"><i
                                    class="fa fa-solid fa-credit-card"></i> Credit/Debit Card</div>
                        </button>
                    </h2>
                    <div id="answer2" class="accordion-collapse collapse" data-bs-parent="#payment-method">
                        <div class="accordion-body">
                            <div class="mb-4" style="font-size: 1.05rem; font-weight: 500;">Enter your Card Details:
                            </div>

                            <form action="" id="payment_form2">

                                <input type="text" name="cardNumber" id="cardNumber" class="form-control"
                                    placeholder="Enter Card Number" value="" maxlength="16">
                                <div id="error-card" class="text-danger" style="min-height: 3vh;font-size: small">
                                </div>
                                <div class="d-flex justify-content-between">
                                    <div class="col-6 me-1">

                                        <input type="tel" name="mm" id="mm" class="form-control" placeholder="MM"
                                            value="" maxlength="2">
                                        <div id="error-mm" class="text-danger"
                                            style="min-height: 3vh;font-size: small;"></div>
                                    </div>
                                    <div class="col-6">

                                        <input type="tel" name="yy" id="yy" class="form-control" placeholder="YY"
                                            value="" maxlength="2">
                                        <div id="error-yy" class="text-danger"
                                            style="min-height: 3vh;font-size: small;"></div>
                                    </div>

                                </div>

                                <input type="text" name="cvv" id="cvv" class="form-control" placeholder="CVV" value=""
                                    maxlength="3">
                                <div id="error-cvv" class="text-danger" style="min-height: 3vh;font-size: small;">
                                </div>
                                <div class="d-flex flex-row-reverse mt-3">
                                    <button class="btn btn-light" onclick="processPayment('Credit/Debit Card')"
                                        style="background-color: rgb(0,32,96); color: aliceblue;">
                                        Verify & Pay
                                    </button>
                                    <button class="btn btn-outline-light me-2"
                                        style="color: rgb(0,32,96); border: 1px solid rgb(0,32,96);">
                                        Cancel
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <hr>
                <div class="accordion-item px-3 pb-3" style="border: none;">
                    <h2 class="accordion-header" id="method3">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                            data-bs-target="#answer3">
                            <div style="font-size: 1.07rem; font-weight: 500;"><i class="fa fa-solid fa-bank"></i> Net
                                Banking</div>
                        </button>
                    </h2>
                    <div id="answer3" class="accordion-collapse collapse" data-bs-parent="#payment-method">
                        <div class="accordion-body">

                            <form action="" id="payment_form3">
                                <label for="bank" class="mb-2">Choose your Bank Name:</label>
                                <select name="bank" id="bank" class="form-control">
                                    <option value="" selected>Choose your bank</option>
                                    <option value="sbi">SBI</option>
                                    <option value="hdfc">HDFC</option>
                                    <option value="icic">ICIC</option>
                                    <option value="axis">Axis</option>
                                </select>
                                <div id="error-bank" class="text-danger" style="min-height: 3vh;font-size: small;"></div>
                                <div class="d-flex justify-content-end">
                                    <button id="bankBtn" onclick="processPayment('Net Banking')" class="btn mt-2"
                                        style="background-color: rgb(0,32,96);color: aliceblue;">Proceed to Pay</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-5 col-xxl-4 p-3 mb-3 mb-lg-5"
            style="box-shadow: 1px 2px 10px darkgray;border-radius: 5px;height: fit-content;background-color: white;">
            <h5>Payment Summary</h5>
            <hr>
            <div class="mt-2" id="payment-summary">
                <div class="m-2"><strong>Name : </strong><span id="name"></span></div>
                <div class="m-2"><strong>Mobile Number: </strong>+91 <span id="number"></span></div>
                <div class="m-2"><strong>Plan Price : </strong>Rs. <span id="price"></span></div>
                <div class="m-2"><strong>Data : </strong><span id="data"></span></div>
                <div class="m-2"><strong>Validity : </strong><span id="validity"></span></div>
                <div class="m-2"><strong>Plan Benefits: </strong><span id="benefits"></span></div>
            </div>
            <hr>
            <div class="m-2"><strong>Amount Payable: </strong>Rs. <span id="amount"></span></div>
        </div>
    </div>

    <script src="./assets/js/payment.js"></script>

</body>

</html>
