<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/plans.css">
    <link rel="stylesheet" href="./assets/css/util.css">
    <script src="./assets/js/plans.js"></script>
    <script src="./assets/js/recharge.js"></script>
    <script src="./assets/js/util.js"></script>
    <title>PrepaidGo | Plans</title>
    <link rel="icon" type="image/x-icon" href="./assets/img/favicon.ico">

</head>

<body>
    <nav class="navbar navbar-expand-md navbar-light bg-white sticky-top"
        style="box-shadow: 1px 2px 10px rgb(198, 198, 198);">
        <div class="container-fluid" id="navbarContainer">

        </div>
    </nav>

    <section class="d-flex flex-column flex-lg-row">

        <aside class="col-lg-4" style="background-color: rgb(0, 32, 96);" id="aside">
            <div class="container-fluid d-flex flex-column align-items-center text-center content p-5 mb-5"
                style="background-color: rgb(0, 32, 96); color: aliceblue; position: sticky; top: 80px;">
                <h1 class="pt-5">Recharge Online!</h1>
                <p class="pb-5">
                    fast , secure and hassel free recharges
                </p>
                <div class=" d-flex recharge-number">
                    <span class="me-1">
                        <div class="input-box" style="background-color: white;" id="mobile-input">
                            <span class="prefix ps-2">+91</span>
                            <input type="tel" name="rechargeNumber" id="rechargeNumber" placeholder="Mobile Number"
                                maxlength="10">
                            <i class="fas fa-circle-exclamation text-danger me-2 d-none" id="error-icon"></i>
                        </div>
                        <div id="error-number" class="text-light d-none mt-2"
                            style="background-color: rgba(255, 0, 0, 0.527);font-size: 0.8rem; border-radius: 2px;padding: 2px;border: 1px solid red;">
                        </div>
                    </span>
                    <div>
                        <button class="btn btn-success d-none" id="saveBtn" onclick="saveNumber()">save</button>
                        <button class="btn btn-primary" id="changeBtn" onclick="changeNumber()">Change</button>
                    </div>
                </div>
            </div>
        </aside>

        <main class="col-lg-8 d-flex pt-5 flex-column justify-content-center align-items-center"
            style="background-color: aliceblue;">

            <h2 class="my-5 mx-2 mt-0 mt-md-3  text-center">Explore Our Exclusive Recharge Plans!</h2>

            <div id="planCarousel" class="carousel slide col-10 col-md-8 my-4" data-bs-ride="carousel">
                <div class="carousel-inner">

                    <div class="carousel-item active">
                        <div class="card text-center p-4 d-flex align-items-center"
                            style=" background-color: rgb(0, 32, 96); color: aliceblue;" id="carousel-card-1">
                            
                        </div>
                    </div>

                    <div class="carousel-item">
                        <div class="card text-center p-4 d-flex align-items-center"
                            style="background-color: rgb(0, 32, 96); color: aliceblue;" id="carousel-card-2">
                            
                        </div>
                    </div>

                    <div class="carousel-item">
                        <div class="card text-center p-4 d-flex align-items-center"
                            style="background-color: rgb(0, 32, 96); color: aliceblue;" id="carousel-card-3">
                           
                        </div>
                    </div>

                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#planCarousel" data-bs-slide="prev">
                    <i class="fa fa-chevron-left text-light"></i>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#planCarousel" data-bs-slide="next">
                    <i class="fa fa-chevron-right text-light"></i>
                </button>
            </div>
            
            <nav id="plans-nav" class = "my-4 d-flex align-items-center justify-content-center col-11">
                <i class="me-1 fas fa-chevron-left"></i>
                <div class="plans-category d-flex noScrollBar p-3" style="overflow-x: auto; width: 90%;
                gap: 20px;
                padding: 10px;
                white-space: nowrap;" id="plan-items">
                    <div class="plan-item text-center">
                        <a class="plan-link p-2" href="#all-plans">All Plans</a>    
                    </div>
                    
                </div>
                <i class="ms-1 fas fa-chevron-right"></i>
            </nav>

            <div class="container-fluid col-sm-9 d-flex flex-column flex-md-row justify-content-start my-3">
                <div class="d-flex justify-content-center me-2">
                    <input id="searchInput" type="search" class="form-control " placeholder="Search" aria-label="Search"
                        aria-describedby="search-addon" style="border-radius: 5px 0px 0px 5px;" />
                    <button onclick="searchPlans(document.getElementById('searchInput').value)" class="btn btn-primary"
                        id="search-addon" style="border-radius: 0px 5px 5px 0px;">
                        <i class="fas fa-search"></i>
                    </button>
                    <!-- <div onclick="clearFilteredPlans()" id="clearFilter" class="btn btn-secondary ms-2 d-none"><i
                            class="fas fa-x"></i></div> -->
                </div>
                <div class="d-flex justify-content-start pt-2">
                    <a onclick="showFilters()" class="text-decoration-none mx-2" id="filter"><i class="fas fa-filter"></i>
                        filter plans
                    </a>
                    <a onclick="clearFilters()" class="text-decoration-none text-muted d-none" id="clear"><i
                            class="fa-solid fa-x"></i> 
                            clear filter
                    </a>
                </div>
            </div>

            <div class="container-fluid col-sm-10 overflow-auto" style="height: 450px;position: relative;">


                <div data-bs-spy="scroll" data-bs-target="#plans-nav"
                    class="scrollspy-example" id="plansContainer">
                    <div class="card m-md-4 my-4 plans" id="all-plans">
                        <div class="card-header" style="border-radius: 5px;">
                            All Plans
                        </div>
                        <div id="all-plan-cards">

                        </div>

                    </div>
                    
                <div id="filterResult" class="m-md-4 my-4 d-none text-danger text-center">

                </div>
        </main>

    </section>

    <div class="modal fade" id="planDetail" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle" style="color: rgb(0, 32, 96);">Plan Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center" id="planBenefits">
                    <h4 id="price"></h4>
                    <span class="me-5"><i class="fas fa-clock-rotate-left me-1"></i><span id="validity"></span></span>
                    <span><i class="fas fa-wifi me-1"></i><span id="data"></span></span>
                    <div><i class="fas fa-phone me-1 mt-2"></i><span id="calls"></span></div>
                    <div><i class="fas fa-message me-1"></i><span id="sms"></span></div>
                    <h6 class="mt-3"><strong>Additional Benefits</strong></h6>
                    <div id="benefits">

                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Ok</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="payConfirmation" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Payment Summary</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
                        onclick="removePlan()"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex justify-content-center">
                       <h4>Rs. <span id="planPrice"></span></h4>
                    </div>

                    <div class="d-flex justify-content-evenly align-items-center">
                        <div class="d-flex">
                            <strong class="me-1">Data: </strong> <span id="planData"></span>
                        </div>
    
                        <div class="d-flex">
                            <strong class="me-1">Validity: </strong> <span id="planValidity"></span>
                        </div>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between">
                        <strong>Amount Payable:</strong> <span id="planAmount"></span>
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-center">

                    <a href="./payment.html"><input type="button" class="btn btn-primary" data-bs-dismiss="model"
                            value="Proceed to Pay"></a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
