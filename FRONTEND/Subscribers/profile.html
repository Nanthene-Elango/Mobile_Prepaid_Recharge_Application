<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
  
    <script src="./assets/js/util.js"></script>
    <link rel="stylesheet" href="./assets/css/util.css">
    <script src="./assets/js/profile.js"></script>
    <title>PrepaidGo | Profile</title>
    <link rel="icon" type="image/x-icon" href="./assets/img/favicon.ico">

    <style>
        .button-toggle .nav-item a:hover,
        .button-toggle .nav-item a.active,
        .button-toggle .nav-item a:focus {
            border-radius: 20px;
            background-color: rgb(0, 32, 96);
            color: aliceblue;
        }

        .badge {
            position: relative;
            top: -11px;
            left: -10px;
            width: 17px;
            height: 17px;
            background-color: red;
            border-radius: 50%;
        }
        #active-plan{
            height: 400px;
        }
        .profile input{
            border: none;
            outline: none;
            border-radius: 5px;
        }
        .profile .edit{
            border: 2px solid rgb(0, 32, 96);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-md navbar-light bg-white sticky-top"
        style="box-shadow: 1px 2px 10px rgb(198, 198, 198);">
        <div class="container-fluid" id="navbarContainer">

        </div>
    </nav>

    <section class="container-fluid d-flex flex-column align-items-center">
        
        <section class="container d-flex flex-column justify-content-around align-items-center mt-5">
            <div class="col-12 d-flex flex-column flex-md-row justify-content-center" style="background-color: white;">

                <div class="col-12 col-md-6 me-md-1"
                    style="box-shadow: 1px 2px 10px darkgray; border-radius: 10px; height: 400px;">
                    <div class="p-5">
                        <div class="d-flex flex-column align-items-center pb-5">
                            <i class="fa-solid fa-user-circle fa-5x" style="color: rgb(0,32,96);"></i>
                            <h1 class="text-center" id="userName"></h1>
                            <div class="text-left pt-3 profile">
                                <div class="pb-2"><i class="fa-solid fa-phone pe-1"></i><input id="userNumber" readonly/>
                                </div>
                                <div class="d-flex justify-content-between">
                                    <div class="pb-2"><i class="fa-solid fa-envelope pe-1"></i><input id="userEmail" class="email" readonly/></div>
                                    <div id="editEmail" onclick="editEmail()" style="cursor: pointer;"><i class="fas fa-edit ps-1"></i></div>
                                    <div id="saveEmail" class="d-none" onclick="saveEmail()" style="cursor: pointer;"><i class="fas fa-check ps-1"></i></div>
                                </div>
                                <div class="pb-2"><i class="fa-solid fa-cake pe-1"></i><input id="userDOB" readonly/></div>
                                <div class=""><i class="fa-solid fa-home pe-1"></i><span id="userAddress"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-5 mt-3 mt-md-0 p-3" id="active-plan"
                    style="box-shadow: 1px 2px 10px darkgray; border-radius: 10px;">
                    <div class="card" style="border: none">
                        <div class="card-header text-center"
                            style="background-color: rgb(0, 32, 96); color: aliceblue;">
                            <h5>Active plan</h5>
                        </div>
                        <div class="card-body align-items-center justify-content-center d-flex" style="height: 320px;">
                            <div class="d-flex flex-column align-items-center d-none" id="no-active-plan">
                                <div class="lead text-muted text-center"><strong>No Active Plan</strong></div>
                                <div class="btn btn-primary text-center mt-2"><a href="./recharge.html"
                                        class="text-light text-decoration-none">Recharge</a>
                                </div>
                            </div>
                            <div  class="d-none" id="plan-active">
                                <h4 class="text-center">Rs. <span id="active-plan-price"></span></h4>
                                <div class="px-2">
                                    <div class="d-flex flex-column justify-content-evenly align-items-center">
                                        <div>
                                            <h6>Data: <span id="active-plan-data" class="text-muted"></span></h6>
                                        </div>
                                        <div>
                                            <h6>Validity: <span class="text-muted" id="active-plan-validity"></span></h6>
                                        </div>
                                        <div>
                                            <h6>Calls & SMS: <span class="text-muted" id="active-plan-calls-sms"></span></h6>
                                        </div>
                                    </div>
                                    <div class="text-center d-none d-lg-block">
                                        
                                        <div id="benefits">
                                            <h6 id="active-plan-benefits" class="d-flex flex-column">Benefits: </h6>
                                            <!-- <span class="text-muted">
                                                <i class="fas fa-phone"></i> Unlimited Calls <br>
                                                <i class="fas fa-message"></i> 100 SMS/day <br>
                                                <i class="fas fa-gift"></i> Amazon Prime Subscription <br>
                                            </span> -->
                                           
                                        </div>
                                    </div>
                                    <hr>
                                    <div class="text-start">
                                        <div><span>Recharge Date: </span><span class="text-muted" id="active-plan-rd"></span></div>
                                        <div><span>Expiry Date: </span><span class="text-muted" id="active-plan-ed"></span></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-11 col-12 my-3 p-4 d-flex flex-column align-items-center justify-content-center"
                style="box-shadow: 1px 2px 10px darkgray;border-radius: 10px; height: fit-content;background-color: white;">
                <ul class="nav mb-4 d-flex align-items-center button-toggle"
                    style="border: 1px solid rgb(0, 32, 96); border-radius: 25px; width: max-content;">
                    <li class="nav-item">
                        <a class="nav-link active" id="recharge-link">Recharge History</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link " id="transactions-link">Transactions</a>
                    </li>
                </ul>
                <div class="col-12">
                    <div id="recharge-history">
                        <div class="container-fluid d-flex flex-column flex-lg-row justify-content-between my-3">
                            <div class="col-lg-6 d-flex justify-content-center mb-2 mb-lg-0">
                                <input id="searchInput" type="search" class="form-control " placeholder="Search"
                                    aria-label="Search" aria-describedby="search-addon"
                                    style="border-radius: 5px 0px 0px 5px;" />
                                <button onclick="searchPlans(document.getElementById('searchInput').value)"
                                    class="btn btn-primary" id="search-addon" style="border-radius: 0px 5px 5px 0px;">
                                    <i class="fas fa-search"></i>
                                </button>
                                <!-- <div onclick="clearFilteredPlans()" id="clearFilter" class="btn btn-secondary ms-2 d-none"><i
                                        class="fas fa-x"></i></div> -->
                            </div>
                            <div class="col-6 col-lg-3">
                                <input type="date" class="form-control">
                            </div>
                        </div>
                        <a onclick="clearFilters()" class="text-decoration-none text-muted m-3 d-none" id="clear"><i
                                class="fa-solid fa-x"></i>
                            clear filter
                        </a>
                        <div class="card">
                            <div class="card-header"
                                style="background-color: rgb(0, 32, 96); color: aliceblue;font-size: large;">
                                Recharge History</div>
                            <div class="card-body" id="recharge-history-card">
                                
                                
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <div id="transactions" style="display: none;">
                        <div class="container-fluid d-flex flex-column flex-lg-row justify-content-between my-3">
                            <div class="col-lg-6 d-flex justify-content-center mb-2 mb-lg-0">
                                <input id="searchInput" type="search" class="form-control " placeholder="Search"
                                    aria-label="Search" aria-describedby="search-addon"
                                    style="border-radius: 5px 0px 0px 5px;" />
                                <button onclick="searchPlans(document.getElementById('searchInput').value)"
                                    class="btn btn-primary" id="search-addon" style="border-radius: 0px 5px 5px 0px;">
                                    <i class="fas fa-search"></i>
                                </button>
                                <!-- <div onclick="clearFilteredPlans()" id="clearFilter" class="btn btn-secondary ms-2 d-none"><i
                                        class="fas fa-x"></i></div> -->
                            </div>
                            <div class="col-6 col-lg-3">
                                <input type="date" class="form-control">
                            </div>
                        </div>
                        <a onclick="clearFilters()" class="text-decoration-none text-muted m-3 d-none" id="clear"><i
                                class="fa-solid fa-x"></i>
                            clear filter
                        </a>
                        <div class="card">
                            <div class="card-header"
                                style="background-color: rgb(0, 32, 96); color: aliceblue;font-size: large;">
                                Transactions</div>
                            <div class="card-body" id="transaction-history-card">
                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </section>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
</body>

</html>
