    <div id="content">
        <button class="btn btn-primary d-md-none m-4" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">☰
            Menu
        </button>

        <nav class=" container-fluid d-md-flex flex-row-reverse sticky-top d-none"
            style="background-color: white; box-shadow: 1px 2px 10px gainsboro;">
            <li class="nav-item dropdown list-unstyled my-2 mx-3" id="accountMenu">
                <a class="nav-link ms-2 p-2" href="#" id="accountDropdown" role="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <div class="d-flex">
                        <i class="fa fa-user-circle fa-2x me-1"></i>
                        <span class="d-flex justify-content-center align-items-center">Admin <i
                                class="fa-solid fa-caret-down ms-1"></i> </span>
                    </div>
                </a>
                <ul class="dropdown-menu dropdown-menu-start">
                    <li><a class="dropdown-item" href="./adminProfile.html">Profile</a></li>
                    <li><a class="dropdown-item text-danger" href="#" onclick="logout()">Logout</a></li>
                </ul>
            </li>
        </nav>

        <div class="container mt-5 col-lg-6">
            <div class="card p-4 shadow-sm">
                <h3 class="text-center mb-4">Admin Profile</h3>
                <div class="text-center mb-3">
                    <i class="fas fa-circle-user fa-5x"></i>
                </div>
        
                <!-- Username -->
                <div class="mb-3">
                    <label class="form-label"><strong>Username:</strong></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" id="username" class="form-control" value="" readonly/>
                        <!-- <button class="btn btn-sm btn-primary" id="editUsernameBtn" onclick="editUsername()">
                            Edit
                        </button>
                        <button class="btn btn-sm btn-success d-none" id="saveUsernameBtn" onclick="saveUsername()">
                            Save
                        </button> -->
                    </div>
                </div>
        
                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label"><strong>Email:</strong></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" name="email" id="email" class="form-control" value="" readonly/>
                        <button class="btn btn-sm btn-primary" id="editEmailBtn" onclick="editEmail()">
                            change
                        </button>
                        <button class="btn btn-sm btn-success d-none" id="saveEmailBtn" onclick="saveEmail()">
                            Save
                        </button>
                    </div>
                </div>
        
                <!-- Mobile Number -->
                <div class="mb-3">
                    <label class="form-label"><strong>Mobile Number:</strong></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-phone"></i></span>
                        <input class="form-control" type="tel" id="phoneNumber" name="phoneNumber" readonly>
                    </div>
                </div>
        
                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label"><strong>Password:</strong></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" id="password" value="" class="form-control" readonly>
                        <button class="btn btn-sm btn-primary" id="editPasswordBtn" onclick="editPassword()">
                            change
                        </button>
                        <button class="btn btn-sm btn-success d-none" id="savePasswordBtn" onclick="savePassword()">
                            Save
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
