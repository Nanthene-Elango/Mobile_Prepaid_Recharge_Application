<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <title>PrepaidGo | ForgotPassword</title>
    <link rel="icon" type="image/x-icon" href="./assets/img/favicon.png">
    <style>
        .input-box {
            border: 1px solid gainsboro;
            border-radius: 5px;
            background-color: white;
        }

    </style>
    <script src="./assets/js/forgotPassword.js"></script>
</head>

<body>
    <div class="col-12 mt-5 d-flex justify-content-center align-items-center">
        <img src="./assets/img/Logo.png" alt="logo" style="height:70px;">
    </div>
    <div class="container p-5 col-10 d-flex justify-content-center"
        style="box-shadow: 1px 2px 10px gainsboro;border-radius: 10px;">
        <div class="col-12 col-md-6">
            <h2 class="text-center">Reset Your Password</h3>
                <div>
                    <input type="text" name="username" id="username" class="form-control mt-4" placeholder="Username">
                    <div class="d-flex input-box my-2 justify-content-between form-control">
                        <input type="password" name="password" id="password"
                            placeholder="New Password" style="border: none;outline: none;">
                        <a id="password-show"
                            class="d-flex text-dark ps-sm-4 pe-1 align-items-center justify-content-end text-decoration-none"
                            style="cursor:pointer;">
                            <i class="fa fa-eye"></i>
                        </a>
                        <a id="password-hide"
                            class="d-flex ps-sm-4 d-none text-dark pe-1 align-items-center justify-content-end text-decoration-none"
                            style="cursor:pointer;">
                            <i class="fas fa-eye-slash "></i>
                        </a>
                    </div>
                    <div class="d-flex input-box my-2 justify-content-between form-control">
                        <input type="password" name="cpassword" id="cpassword" placeholder="Confirm Password"
                            style="border: none;outline: none;">
                        <a id="cpassword-show"
                            class="d-flex text-dark ps-sm-4 pe-1 align-items-center justify-content-end text-decoration-none"
                            style="cursor:pointer;">
                            <i class="fa fa-eye"></i>
                        </a>
                        <a id="cpassword-hide"
                            class="d-flex ps-sm-4 d-none pe-1 text-dark align-items-center justify-content-end text-decoration-none"
                            style="cursor:pointer;">
                            <i class="fas fa-eye-slash "></i>
                        </a>
                    </div>
                    <button class="btn btn-primary w-100 my-3">Change Password</button>
                </div>
        </div>
    </div>
</body>

</html>
